schema_version: 1
status: example_only
policy: "Never commit actual credentials, OAuth tokens, API keys or client data."
secrets:
  - logical_name: connections_runtime_token
    owner: connections
    environment: staging
    location: "Coolify runtime secret manager or approved external secret store"
    allowed_consumers: ["approved Open Flow adapter"]
